<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Camera Live Stream Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0f141c;
      --bg-card: #171f2c;
      --bg-input: #101621;
      --border: #243044;
      --border-focus: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #38bdf8;
    }

    .header-brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Layout */
    .main-layout {
      flex: 1;
      display: flex;
      padding: 1.5rem;
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
    }

    /* Video Section */
    .video-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .stream-card {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 440px;
      max-height: calc(100vh - 240px);
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .camera-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .feed-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .live-pill {
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .btn-fullscreen {
      pointer-events: auto;
      background: rgba(15, 20, 28, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-fullscreen:hover {
      background: rgba(56, 189, 248, 0.3);
    }

    /* Placeholder */
    .stream-placeholder {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .placeholder-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }

    .stream-placeholder h2 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .stream-placeholder p {
      font-size: 0.88rem;
      max-width: 440px;
      line-height: 1.5;
      margin: 0 auto;
    }

    /* Config Panel */
    .config-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .config-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .input-row {
      display: flex;
      gap: 0.6rem;
    }

    .url-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .url-input:focus {
      border-color: var(--border-focus);
    }

    .btn-connect {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn-connect:hover {
      background: var(--accent-hover);
    }

    .btn-disconnect {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-disconnect:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .presets-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .presets-title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-layout {
        padding: 0.75rem;
      }
      .stream-card {
        min-height: 340px;
      }
      .input-row {
        flex-direction: column;
      }
      .btn-connect, .btn-disconnect {
        width: 100%;
        padding: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="header-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 7l-7 5 7 5V7z"></path>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <h1>Robot Camera Live Stream</h1>
    </div>
    <div class="header-status">
      <span class="status-badge" id="status-badge">
        <span class="status-dot"></span> Disconnected
      </span>
    </div>
  </header>

  <main class="main-layout">
    
    <!-- Video Stream Display Area -->
    <section class="video-section">
      <div class="stream-card">
        
        <!-- Live Stream Image Tag -->
        <img 
          id="camera-feed" 
          class="camera-feed" 
          alt="Live Camera Feed"
          style="display: none;"
        >

        <!-- Placeholder when disconnected or on error -->
        <div class="stream-placeholder" id="stream-placeholder">
          <div class="placeholder-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M23 7l-7 5 7 5V7z"></path>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </div>
          <h2 id="placeholder-title">No Camera Connected</h2>
          <p id="placeholder-msg">Enter your mobile phone IP Webcam link below and click Connect to start the live video feed.</p>
        </div>

        <!-- Video Overlay Controls (Fullscreen) -->
        <div class="feed-overlay" id="feed-overlay" style="display: none;">
          <span class="live-pill">● LIVE</span>
          <button class="btn-fullscreen" id="btn-fullscreen" title="Toggle Fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 3 21 3 21 9"></polyline>
              <polyline points="9 21 3 21 3 15"></polyline>
              <line x1="21" y1="3" x2="14" y2="10"></line>
              <line x1="3" y1="21" x2="10" y2="14"></line>
            </svg>
          </button>
        </div>

      </div>

      <!-- IP Camera Configuration Panel -->
      <div class="config-panel">
        <label for="stream-url" class="config-label">Camera Stream URL (IP Webcam / MJPEG):</label>
        
        <div class="input-row">
          <input 
            type="text" 
            id="stream-url" 
            class="url-input" 
            placeholder="http://172.16.237.254:8080/video"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="btn-connect" id="btn-connect">Connect</button>
          <button class="btn-disconnect" id="btn-disconnect">Disconnect</button>
        </div>

        <!-- Quick Presets -->
        <div class="presets-row">
          <span class="presets-title">Quick Presets:</span>
          <button class="preset-btn" data-url="http://172.16.237.254:8080/video">Phone (:8080/video)</button>
          <button class="preset-btn" data-url="http://192.168.1.50:4747/video">DroidCam (:4747/video)</button>
          <button class="preset-btn" data-url="http://192.168.1.50:81/stream">ESP32-CAM (:81/stream)</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Script (All in one self-contained) -->
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'robot_camera_ip_url';

      const urlInput = document.getElementById('stream-url');
      const btnConnect = document.getElementById('btn-connect');
      const btnDisconnect = document.getElementById('btn-disconnect');
      const presetButtons = document.querySelectorAll('.preset-btn');
      const statusBadge = document.getElementById('status-badge');
      const cameraFeed = document.getElementById('camera-feed');
      const streamPlaceholder = document.getElementById('stream-placeholder');
      const placeholderTitle = document.getElementById('placeholder-title');
      const placeholderMsg = document.getElementById('placeholder-msg');
      const feedOverlay = document.getElementById('feed-overlay');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const streamCard = document.querySelector('.stream-card');

      let connectionTimer = null;

      function setStatus(state, message) {
        statusBadge.className = 'status-badge ' + state;

        if (state === 'connected') {
          statusBadge.innerHTML = '<span class="status-dot"></span> Live';
          cameraFeed.style.display = 'block';
          streamPlaceholder.style.display = 'none';
          feedOverlay.style.display = 'flex';
        } else if (state === 'connecting') {
          statusBadge.innerHTML = '<span class="status-dot"></span> Connecting...';
          cameraFeed.style.display = 'none';
          streamPlaceholder.style.display = 'block';
          feedOverlay.style.display = 'none';
          placeholderTitle.textContent = 'Connecting to Camera...';
          placeholderMsg.textContent = 'Contacting ' + (urlInput.value || 'stream') + '. Please verify your phone camera server is running.';
        } else if (state === 'error') {
          statusBadge.innerHTML = '<span class="status-dot"></span> Connection Failed';
          cameraFeed.style.display = 'none';
          streamPlaceholder.style.display = 'block';
          feedOverlay.style.display = 'none';
          placeholderTitle.textContent = 'Unable to Connect';
          placeholderMsg.textContent = message || 'Could not load camera stream. Verify the IP address, port, and ensure your phone is on the same Wi-Fi network.';
        } else {
          statusBadge.innerHTML = '<span class="status-dot"></span> Disconnected';
          cameraFeed.style.display = 'none';
          streamPlaceholder.style.display = 'block';
          feedOverlay.style.display = 'none';
          placeholderTitle.textContent = 'No Camera Connected';
          placeholderMsg.textContent = 'Enter your mobile phone IP Webcam link below and click Connect to start the live video feed.';
        }
      }

      function normalizeUrl(rawUrl) {
        let url = rawUrl.trim();
        if (url.startsWith('https://')) {
          url = 'http://' + url.slice(8);
        } else if (!url.startsWith('http://')) {
          url = 'http://' + url;
        }

        try {
          const parsed = new URL(url);
          if ((parsed.pathname === '/' || parsed.pathname === '') && parsed.port === '8080') {
            url = url.replace(/\/+$/, '') + '/video';
          }
        } catch (e) {
          if (url.endsWith(':8080') || url.endsWith(':8080/')) {
            url = url.replace(/\/+$/, '') + '/video';
          }
        }

        return url;
      }

      function connectStream(rawUrl) {
        if (!rawUrl || !rawUrl.trim()) {
          alert('Please enter a valid IP camera stream URL (e.g. http://172.16.237.254:8080/video)');
          return;
        }

        const cleanUrl = normalizeUrl(rawUrl);
        urlInput.value = cleanUrl;

        try {
          localStorage.setItem(STORAGE_KEY, cleanUrl);
        } catch (e) {
          console.warn('localStorage unavailable', e);
        }

        if (connectionTimer) {
          clearTimeout(connectionTimer);
          connectionTimer = null;
        }

        setStatus('connecting');
        cameraFeed.src = '';

        let isSuccess = false;

        cameraFeed.onload = function () {
          if (isSuccess) return;
          isSuccess = true;
          if (connectionTimer) clearTimeout(connectionTimer);
          setStatus('connected');
        };

        cameraFeed.onerror = function () {
          if (isSuccess) return;
          if (connectionTimer) clearTimeout(connectionTimer);
          setStatus('error', 'Stream failed to load. Ensure your phone and computer are on the same Wi-Fi subnet and the IP Webcam app is active.');
        };

        connectionTimer = setTimeout(function () {
          if (!isSuccess) {
            cameraFeed.src = '';
            setStatus('error', 'Connection timed out. Check that the IP and port are correct and the phone camera server is started.');
          }
        }, 6000);

        cameraFeed.src = cleanUrl;
      }

      function disconnectStream() {
        if (connectionTimer) {
          clearTimeout(connectionTimer);
          connectionTimer = null;
        }
        cameraFeed.src = '';
        setStatus('disconnected');
      }

      btnConnect.addEventListener('click', function () {
        connectStream(urlInput.value);
      });

      urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          connectStream(urlInput.value);
        }
      });

      btnDisconnect.addEventListener('click', disconnectStream);

      presetButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const targetUrl = btn.getAttribute('data-url');
          if (targetUrl) {
            urlInput.value = targetUrl;
            connectStream(targetUrl);
          }
        });
      });

      btnFullscreen.addEventListener('click', function () {
        if (!document.fullscreenElement) {
          streamCard.requestFullscreen().catch(function (err) {
            console.error('Fullscreen request failed:', err);
          });
        } else {
          document.exitFullscreen();
        }
      });

      const savedUrl = localStorage.getItem(STORAGE_KEY);
      if (savedUrl && savedUrl.trim()) {
        urlInput.value = savedUrl.trim();
        connectStream(savedUrl.trim());
      } else {
        setStatus('disconnected');
      }

    })();
  </script>
</body>
</html>
